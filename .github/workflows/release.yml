name: publish-release
# Publishes the committed binaries + signed update manifest as a GitHub
# Release so `simplicio update` (which downloads from
# github.com/<repo>/releases/latest/download/...) works for beta testers.
on:
  push:
    branches: [master, main]
    paths:
      - simplicio.exe
      - simplicio
      - simplicio-darwin-x64
      - simplicio-linux-x64
      - simplicio-update-manifest.json
      - .github/workflows/release.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from manifest
        id: ver
        shell: pwsh
        run: echo "version=$((Get-Content simplicio-update-manifest.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item simplicio.exe dist/simplicio-windows-x86_64.exe
          Copy-Item simplicio dist/simplicio-macos-arm64
          if (Test-Path simplicio-darwin-x64) { Copy-Item simplicio-darwin-x64 dist/simplicio-darwin-x64 }
          if (Test-Path simplicio-linux-x64) { Copy-Item simplicio-linux-x64 dist/simplicio-linux-x64 }
          Copy-Item simplicio-update-manifest.json dist/
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower()) *$($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "v${{ steps.ver.outputs.version }} — Public Beta"
          body: |
            Free public beta. All features remain unlocked during the public-beta phase.

            Windows: `irm https://raw.githubusercontent.com/wesleysimplicio/simplicio/master/install.ps1 | iex`
            macOS/Linux: `curl -fsSL https://raw.githubusercontent.com/wesleysimplicio/simplicio/master/install.sh | sh`

            Signed update manifest included (`simplicio update check`).
          prerelease: false
          make_latest: "true"
          files: |
            dist/simplicio-windows-x86_64.exe
            dist/simplicio-macos-arm64
            dist/simplicio-darwin-x64
            dist/simplicio-linux-x64
            dist/simplicio-update-manifest.json
            dist/SHA256SUMS
