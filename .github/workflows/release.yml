name: publish-release
# Manual-only publisher for a freshly prepared tag. It refuses to mutate a
# release unless the tag-bound and working manifests have identical provenance.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read version from manifest
        id: ver
        shell: pwsh
        run: echo "version=$((Get-Content simplicio-update-manifest.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Read immutable tag provenance and remote release state
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Refusing to create or move missing tag $tag; publish the signed provenance first."
          }
          New-Item -ItemType Directory -Force -Path .release | Out-Null
          git show "${tag}:simplicio-update-manifest.json" | Set-Content -Encoding utf8 .release/tag-manifest.json
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $tag does not contain simplicio-update-manifest.json."
          }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            $response.Content | Set-Content -Encoding utf8 .release/remote-release.json
          } elseif ($response.StatusCode -eq 404) {
            '{"assets":[]}' | Set-Content -Encoding utf8 .release/remote-release.json
          } else {
            throw "Could not verify immutable remote release state: HTTP $($response.StatusCode)."
          }
      - name: Verify tag provenance and immutable remote assets
        run: >-
          python scripts/verify_release_provenance.py
          --working-manifest simplicio-update-manifest.json
          --tag-manifest .release/tag-manifest.json
          --remote-release .release/remote-release.json
      - name: Download and verify manifest artifacts
        shell: pwsh
        run: |
          $manifest = Get-Content simplicio-update-manifest.json -Raw | ConvertFrom-Json
          if (-not $manifest.artifacts -or $manifest.artifacts.Count -eq 0) {
            throw "Manifest contains no release artifacts."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $releasePrefix = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$($manifest.version)/"
          foreach ($artifact in $manifest.artifacts) {
            if (-not $artifact.artifact -or -not $artifact.url -or -not $artifact.sha256) {
              throw "Manifest artifact is missing artifact/url/sha256 provenance."
            }
            $expectedUrl = "$releasePrefix$($artifact.artifact)"
            if ($artifact.url -ne $expectedUrl) {
              throw "Artifact URL must be version-bound: expected $expectedUrl, got $($artifact.url)."
            }
            if ($manifest.security.signature_required -and -not $artifact.signature) {
              throw "Artifact $($artifact.artifact) is missing its required signature."
            }
            $destination = Join-Path dist $artifact.artifact
            Invoke-WebRequest -Uri $artifact.url -OutFile $destination -UseBasicParsing
            $actualHash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLower()
            if ($actualHash -ne $artifact.sha256.ToLower()) {
              throw "SHA256 mismatch for $($artifact.artifact): expected $($artifact.sha256), got $actualHash."
            }
          }
          Copy-Item simplicio-update-manifest.json dist/
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower()) *$($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS
      - name: Create release or upload only new assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "v${{ steps.ver.outputs.version }} — Public Beta"
          body: |
            Free public beta. All features remain unlocked during the public-beta phase.

            Windows: `irm https://raw.githubusercontent.com/wesleysimplicio/simplicio/master/install.ps1 | iex`
            macOS/Linux: `curl -fsSL https://raw.githubusercontent.com/wesleysimplicio/simplicio/master/install.sh | sh`

            Signed update manifest included (`simplicio update check`).
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          overwrite_files: false
          files: dist/*
