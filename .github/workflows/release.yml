name: publish-release
# Republishes only manifest-declared, checksum-verified artifacts. Checked-in
# wrapper binaries are never renamed or treated as release provenance.
on:
  push:
    branches: [master]
    paths:
      - simplicio-update-manifest.json
      - .github/workflows/release.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version from manifest
        id: ver
        shell: pwsh
        run: echo "version=$((Get-Content simplicio-update-manifest.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Require an existing immutable release tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Refusing to create or move missing tag $tag; publish the signed provenance first."
          }
      - name: Download and verify manifest artifacts
        shell: pwsh
        run: |
          $manifest = Get-Content simplicio-update-manifest.json -Raw | ConvertFrom-Json
          if (-not $manifest.artifacts -or $manifest.artifacts.Count -eq 0) {
            throw "Manifest contains no release artifacts."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $releasePrefix = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$($manifest.version)/"
          foreach ($artifact in $manifest.artifacts) {
            if (-not $artifact.artifact -or -not $artifact.url -or -not $artifact.sha256) {
              throw "Manifest artifact is missing artifact/url/sha256 provenance."
            }
            $expectedUrl = "$releasePrefix$($artifact.artifact)"
            if ($artifact.url -ne $expectedUrl) {
              throw "Artifact URL must be version-bound: expected $expectedUrl, got $($artifact.url)."
            }
            if ($manifest.security.signature_required -and -not $artifact.signature) {
              throw "Artifact $($artifact.artifact) is missing its required signature."
            }
            $destination = Join-Path dist $artifact.artifact
            Invoke-WebRequest -Uri $artifact.url -OutFile $destination -UseBasicParsing
            $actualHash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLower()
            if ($actualHash -ne $artifact.sha256.ToLower()) {
              throw "SHA256 mismatch for $($artifact.artifact): expected $($artifact.sha256), got $actualHash."
            }
          }
          Copy-Item simplicio-update-manifest.json dist/
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower()) *$($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "v${{ steps.ver.outputs.version }} — Public Beta"
          body: |
            Free public beta. All features remain unlocked during the public-beta phase.

            Windows: `irm https://raw.githubusercontent.com/wesleysimplicio/simplicio/master/install.ps1 | iex`
            macOS/Linux: `curl -fsSL https://raw.githubusercontent.com/wesleysimplicio/simplicio/master/install.sh | sh`

            Signed update manifest included (`simplicio update check`).
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist/*
