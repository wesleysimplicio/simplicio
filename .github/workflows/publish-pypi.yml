name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built simplicio-installer package to PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build package
        run: |
          python -m pip install --upgrade build twine
          python -m build pypi/simplicio
          python -m twine check pypi/simplicio/dist/*
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplicio-installer-dist
          path: pypi/simplicio/dist/

  release-install-smoke:
    if: inputs.publish == true
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-x64}
          - {os: windows-latest, target: windows-x64}
          - {os: macos-13, target: macos-x64}
          - {os: macos-14, target: macos-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test terminal and PyPI installers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_install_smoke.py --version "$(python -c 'import json; print(json.load(open("simplicio-update-manifest.json"))["version"])')" --json | tee release-install-${{ matrix.target }}.json
      - name: Upload release install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-install-smoke-${{ matrix.target }}
          path: release-install-${{ matrix.target }}.json
          retention-days: 30

  publish:
    if: inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/simplicio-installer
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simplicio-installer-dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Publish package
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --username __token__ --password "$PYPI_API_TOKEN" dist/*
