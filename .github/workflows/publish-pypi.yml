name: publish-pypi
run-name: publish-pypi v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact simplicio-installer version already present on master"
        required: true
        type: string
      publish:
        description: "Publish after all four prepublication install smokes pass"
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-pypi-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify public wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package is bound to the exact public manifest
        run: |
          python scripts/prepare_pypi_release.py \
            --version "${{ inputs.version }}" \
            --check \
            --json
      - name: Build wheel only
        run: |
          python -m pip install --upgrade build twine
          rm -rf pypi/simplicio/build pypi/simplicio/dist pypi/simplicio/*.egg-info
          python -m build --wheel pypi/simplicio
          python -m twine check pypi/simplicio/dist/*.whl
          test "$(find pypi/simplicio/dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test -z "$(find pypi/simplicio/dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
      - name: Upload exact wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplicio-installer-dist
          path: pypi/simplicio/dist/*.whl
          if-no-files-found: error
          retention-days: 30

  prepublish-install-smoke:
    name: Prepublish install / ${{ matrix.target }}
    if: inputs.publish == true
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-x64}
          - {os: windows-latest, target: windows-x64}
          - {os: macos-15-intel, target: macos-x64}
          - {os: macos-14, target: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: simplicio-installer-dist
          path: dist/
      - name: Test terminal installer and exact local wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/release_install_smoke.py \
            --version "${{ inputs.version }}" \
            --wheel "$wheel" \
            --json | tee prepublish-install-${{ matrix.target }}.json
      - name: Upload prepublication install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepublish-install-${{ matrix.target }}
          path: prepublish-install-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish public wheel with PyPI Trusted Publishing
    if: inputs.publish == true && github.repository == 'wesleysimplicio/simplicio'
    needs: [build, prepublish-install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/simplicio-installer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simplicio-installer-dist
          path: dist/
      - name: Publish signed public distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  release-install-smoke:
    name: Published PyPI install / ${{ matrix.target }}
    if: inputs.publish == true && github.repository == 'wesleysimplicio/simplicio'
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-x64}
          - {os: windows-latest, target: windows-x64}
          - {os: macos-15-intel, target: macos-x64}
          - {os: macos-14, target: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test terminal and published PyPI installers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_install_smoke.py \
            --version "${{ inputs.version }}" \
            --json | tee release-install-${{ matrix.target }}.json
      - name: Upload published install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-install-${{ matrix.target }}
          path: release-install-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 30
